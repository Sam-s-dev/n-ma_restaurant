# =============================================================
# Déploiement sur Render (Blueprint)
# Render lit ce fichier et crée la base PostgreSQL + le service API.
#
#   1. Render → New → Blueprint → choisir le dépôt GitHub
#   2. Renseigner SEED_SUPERADMIN_EMAIL et SEED_SUPERADMIN_PASSWORD
#   3. Apply — c'est tout.
#
# Au démarrage, le conteneur applique lui-même les migrations puis crée le
# compte Super Admin. Aucune commande manuelle n'est nécessaire, ce qui
# permet de déployer sur le plan gratuit (qui n'offre pas d'accès shell).
# =============================================================

databases:
  - name: restaurant-db
    databaseName: restaurant
    user: restaurant
    plan: free

services:
  # ------------------------------------------------------------------
  # Frontend — version web de l'application Expo, servie en statique.
  # ------------------------------------------------------------------
  - type: web
    name: restaurant-web
    runtime: static
    rootDir: mobile
    buildCommand: npm ci && npx expo export --platform web --output-dir dist-web
    staticPublishPath: dist-web
    envVars:
      # Fixée au moment de la compilation : Expo remplace la variable dans
      # le bundle, elle n'est pas lue à l'exécution.
      - key: EXPO_PUBLIC_API_URL
        value: https://n-ma-restaurant.onrender.com
    routes:
      # Application à page unique : toute route inconnue rend index.html,
      # sinon un rechargement sur /login renverrait une 404.
      - type: rewrite
        source: /*
        destination: /index.html

  # ------------------------------------------------------------------
  # Backend — API + migrations, dans un conteneur Docker.
  # ------------------------------------------------------------------
  - type: web
    name: restaurant-api
    runtime: docker
    plan: free
    region: frankfurt
    # Le Dockerfile attend la racine du dépôt comme contexte de build.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString

      # Base managée Render : TLS obligatoire.
      - key: DATABASE_SSL
        value: require

      # Généré automatiquement par Render, jamais commité.
      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 2h
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: LOG_LEVEL
        value: info

      # Les migrations sont appliquées au démarrage du conteneur.
      - key: AUTO_MIGRATE
        value: 'true'

      # Restreindre aux origines de l'application une fois celle-ci publiée.
      - key: CORS_ORIGINS
        value: '*'

      # À renseigner dans le tableau de bord Render (marquées `sync: false`
      # pour ne jamais figurer en clair dans le dépôt).
      # Le compte est créé — ou son mot de passe mis à jour — à chaque
      # démarrage du service.
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_SUPERADMIN_NAME
        value: Super Admin

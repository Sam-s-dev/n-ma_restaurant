# =============================================================
# Déploiement sur Render (Blueprint)
# Render lit ce fichier et crée la base + le service API.
#   1. Pousser le dépôt sur GitHub
#   2. Render → New → Blueprint → sélectionner le dépôt
#   3. Renseigner SEED_SUPERADMIN_EMAIL / SEED_SUPERADMIN_PASSWORD
# =============================================================

databases:
  - name: restaurant-db
    databaseName: restaurant
    user: restaurant
    plan: free

services:
  - type: web
    name: restaurant-api
    runtime: docker
    plan: free
    region: frankfurt
    # Le Dockerfile attend la racine du dépôt comme contexte de build.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-db
          property: connectionString

      # Base managée Render : TLS obligatoire.
      - key: DATABASE_SSL
        value: require

      # Généré automatiquement par Render, jamais commité.
      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 2h
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '30'
      - key: BCRYPT_ROUNDS
        value: '12'
      - key: LOG_LEVEL
        value: info

      # Les migrations sont appliquées au démarrage du conteneur.
      - key: AUTO_MIGRATE
        value: 'true'

      # Restreindre aux origines de l'application une fois celle-ci publiée.
      - key: CORS_ORIGINS
        value: '*'

      # À renseigner dans le tableau de bord Render (marquées `sync: false`
      # pour ne pas figurer en clair dans le dépôt).
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_SUPERADMIN_NAME
        value: Super Admin
